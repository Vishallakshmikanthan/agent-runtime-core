name: Release & Publish arc-sdk to PyPI

on:
  push:
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies & arc-sdk
        run: |
          python -m pip install --upgrade pip
          pip install -e "arc-sdk[dev,all]"

      - name: Run Tests
        run: |
          python -m pytest arc-sdk/tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    if: github.ref == 'refs/heads/master' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          cd arc-sdk
          python -m build

      - name: Check package with twine
        run: |
          cd arc-sdk
          python -m twine check dist/*

      - name: Publish package to PyPI / TestPyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          cd arc-sdk
          TOKEN="$PYPI_API_TOKEN"
          if [ -z "$TOKEN" ]; then
            TOKEN="$PYPI_TOKEN"
          fi
          if [ -z "$TOKEN" ]; then
            echo "ERROR: PYPI_API_TOKEN secret is not set in GitHub Secrets!"
            echo "Please add your PyPI API token to GitHub Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          export TWINE_USERNAME="__token__"
          export TWINE_PASSWORD="$TOKEN"

          if [[ "$TOKEN" == pyp1-* ]]; then
            echo "Detected TestPyPI API token (pyp1-...). Uploading to TestPyPI (https://test.pypi.org/legacy/)..."
            python -m twine upload --repository-url https://test.pypi.org/legacy/ --verbose --non-interactive --skip-existing dist/*
          else
            echo "Detected Production PyPI API token (pypi-...). Uploading to Production PyPI (https://upload.pypi.org/legacy/)..."
            python -m twine upload --verbose --non-interactive --skip-existing dist/*
          fi

      - name: Create GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v0.1.0
          name: Release v0.1.0 (arc-agent-sdk)
          files: |
            arc-sdk/dist/*.whl
            arc-sdk/dist/*.tar.gz
