name: Release & Publish arc-sdk to PyPI

on:
  push:
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies & arc-sdk
        run: |
          python -m pip install --upgrade pip
          pip install -e "arc-sdk[dev,all]"

      - name: Run Tests
        run: |
          python -m pytest arc-sdk/tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: github.ref == 'refs/heads/master' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          cd arc-sdk
          python -m build

      - name: Publish package to PyPI
        run: |
          cd arc-sdk
          TOKEN="${{ secrets.PYPI_API_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.PYPI_TOKEN }}"
          fi
          if [ -z "$TOKEN" ]; then
            echo "ERROR: Neither PYPI_API_TOKEN nor PYPI_TOKEN secret is set in GitHub Secrets!"
            echo "Please add your PyPI API token to GitHub Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "Uploading arc-agent-sdk package to PyPI..."
          python -m twine upload --verbose --non-interactive --skip-existing -u __token__ -p "$TOKEN" dist/*
