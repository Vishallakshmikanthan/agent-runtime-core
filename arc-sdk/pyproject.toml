[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-sdk"
dynamic = ["version"]
description = "Agent Runtime Core (ARC) — a provider-agnostic reliability runtime for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ARC Team" }]
keywords = [
    "ai",
    "agents",
    "llm",
    "reliability",
    "observability",
    "tracing",
    "firewall",
    "recovery",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "typing-extensions>=4.7.0; python_version < '3.11'",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.19.0"]
openai = ["openai>=1.0.0"]
gemini = ["google-generativeai>=0.5.0"]
mcp = ["mcp>=0.1.0; python_version >= '3.10'"]
all = [
    "anthropic>=0.19.0",
    "openai>=1.0.0",
    "google-generativeai>=0.5.0",
    "mcp>=0.1.0; python_version >= '3.10'",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
arc = "arc.cli:main"

[project.urls]
Homepage = "https://github.com/Vishallakshmikanthan/agent-runtime-core"
Repository = "https://github.com/Vishallakshmikanthan/agent-runtime-core.git"
Documentation = "https://github.com/Vishallakshmikanthan/agent-runtime-core/tree/master/arc-sdk/docs"
Changelog = "https://github.com/Vishallakshmikanthan/agent-runtime-core/blob/master/arc-sdk/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "arc.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["arc*"]

[tool.setuptools.package-data]
arc = ["py.typed"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.semantic_release]
version_variables = ["arc/version.py:__version__"]
branch = "master"
build_command = "python -m build"